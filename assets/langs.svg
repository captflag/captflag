<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0e8a94"/><stop offset="1" stop-color="#155e75"/></linearGradient>
<linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeecb"/><stop offset="1" stop-color="#f3d9a4"/></linearGradient>
